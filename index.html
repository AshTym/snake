<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Snake</title>
<style>
  :root {
    --bg: #0f1720;
    --panel: #17212b;
    --grid: #1c2733;
    --snake: #4ade80;
    --snake-head: #86efac;
    --food: #f87171;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 16px;
  }
  h1 {
    margin: 0;
    font-size: 20px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
  }
  .hud {
    display: flex;
    gap: 24px;
    font-variant-numeric: tabular-nums;
    font-size: 14px;
    color: var(--muted);
  }
  .hud b { color: var(--text); font-weight: 600; }
  .stage {
    position: relative;
    width: min(90vw, 90vh, 460px);
    aspect-ratio: 1 / 1;
  }
  canvas {
    width: 100%;
    height: 100%;
    background: var(--panel);
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    display: block;
    touch-action: none;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: rgba(15, 23, 32, 0.82);
    border-radius: 12px;
    text-align: center;
    padding: 20px;
    backdrop-filter: blur(2px);
  }
  .overlay.hidden { display: none; }
  .overlay h2 { margin: 0; font-size: 24px; }
  .overlay p { margin: 0; color: var(--muted); font-size: 14px; }
  button {
    margin-top: 8px;
    border: 0;
    border-radius: 8px;
    padding: 10px 22px;
    font-size: 15px;
    font-weight: 600;
    color: #04121b;
    background: var(--accent);
    cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  .hint {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    max-width: 460px;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <h1>Snake</h1>
  <div class="hud">
    <span>Score <b id="score">0</b></span>
    <span>Best <b id="best">0</b></span>
  </div>
  <div class="stage">
    <canvas id="game" width="400" height="400"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlay-title">Snake</h2>
      <p id="overlay-text">Eat the food, don't hit the walls or yourself.</p>
      <button id="start-btn">Play</button>
    </div>
  </div>
  <p class="hint">Arrow keys or WASD to steer &middot; swipe on touch &middot; P or Space to pause</p>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var scoreEl = document.getElementById("score");
  var bestEl = document.getElementById("best");
  var overlay = document.getElementById("overlay");
  var overlayTitle = document.getElementById("overlay-title");
  var overlayText = document.getElementById("overlay-text");
  var startBtn = document.getElementById("start-btn");

  var CELLS = 20;
  var CELL = canvas.width / CELLS;
  var STEP_MS = 110;

  var snake, dir, nextDir, food, score, best, alive, running, acc, last, paused;

  best = Number(localStorage.getItem("snake_best") || 0);
  bestEl.textContent = best;

  function reset() {
    snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    alive = true;
    paused = false;
    scoreEl.textContent = "0";
    placeFood();
  }

  function placeFood() {
    while (true) {
      var f = {
        x: Math.floor(Math.random() * CELLS),
        y: Math.floor(Math.random() * CELLS)
      };
      var onSnake = snake.some(function (s) { return s.x === f.x && s.y === f.y; });
      if (!onSnake) { food = f; return; }
    }
  }

  function setDir(x, y) {
    // no reversing directly onto self
    if (x === -dir.x && y === -dir.y) return;
    nextDir = { x: x, y: y };
  }

  function tick() {
    dir = nextDir;
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (
      head.x < 0 || head.x >= CELLS ||
      head.y < 0 || head.y >= CELLS ||
      snake.some(function (s) { return s.x === head.x && s.y === head.y; })
    ) {
      gameOver();
      return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 1;
      scoreEl.textContent = String(score);
      if (score > best) {
        best = score;
        bestEl.textContent = String(best);
        localStorage.setItem("snake_best", String(best));
      }
      placeFood();
    } else {
      snake.pop();
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    var styles = getComputedStyle(document.documentElement);
    ctx.fillStyle = styles.getPropertyValue("--panel").trim() || "#17212b";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = styles.getPropertyValue("--grid").trim() || "#1c2733";
    ctx.lineWidth = 1;
    for (var i = 1; i < CELLS; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL, 0);
      ctx.lineTo(i * CELL, canvas.height);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * CELL);
      ctx.lineTo(canvas.width, i * CELL);
      ctx.stroke();
    }

    var pad = 2;
    ctx.fillStyle = styles.getPropertyValue("--food").trim() || "#f87171";
    roundRect(food.x * CELL + pad, food.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, 5);
    ctx.fill();

    for (var j = snake.length - 1; j >= 0; j--) {
      var seg = snake[j];
      ctx.fillStyle = j === 0
        ? (styles.getPropertyValue("--snake-head").trim() || "#86efac")
        : (styles.getPropertyValue("--snake").trim() || "#4ade80");
      roundRect(seg.x * CELL + pad, seg.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, 5);
      ctx.fill();
    }
  }

  function loop(ts) {
    if (!running) return;
    if (!last) last = ts;
    var delta = ts - last;
    last = ts;

    if (!paused && alive) {
      acc += delta;
      while (acc >= STEP_MS) {
        acc -= STEP_MS;
        tick();
        if (!alive) break;
      }
    }
    draw();
    requestAnimationFrame(loop);
  }

  function start() {
    reset();
    overlay.classList.add("hidden");
    running = true;
    acc = 0;
    last = 0;
    requestAnimationFrame(loop);
  }

  function gameOver() {
    alive = false;
    running = false;
    overlayTitle.textContent = "Game Over";
    overlayText.textContent = "Score " + score + "  ·  Best " + best;
    startBtn.textContent = "Play again";
    overlay.classList.remove("hidden");
  }

  function togglePause() {
    if (!running || !alive) return;
    paused = !paused;
    if (paused) {
      overlayTitle.textContent = "Paused";
      overlayText.textContent = "Press P or Space to resume";
      startBtn.textContent = "Resume";
      overlay.classList.remove("hidden");
    } else {
      overlay.classList.add("hidden");
      last = 0;
    }
  }

  startBtn.addEventListener("click", function () {
    if (paused && running) { togglePause(); return; }
    start();
  });

  window.addEventListener("keydown", function (e) {
    switch (e.key) {
      case "ArrowUp": case "w": case "W": setDir(0, -1); e.preventDefault(); break;
      case "ArrowDown": case "s": case "S": setDir(0, 1); e.preventDefault(); break;
      case "ArrowLeft": case "a": case "A": setDir(-1, 0); e.preventDefault(); break;
      case "ArrowRight": case "d": case "D": setDir(1, 0); e.preventDefault(); break;
      case "p": case "P": togglePause(); break;
      case " ":
        e.preventDefault();
        if (!running) start();
        else togglePause();
        break;
    }
  });

  // touch / swipe
  var touchStart = null;
  canvas.addEventListener("touchstart", function (e) {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  canvas.addEventListener("touchend", function (e) {
    if (!touchStart) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - touchStart.x;
    var dy = t.clientY - touchStart.y;
    touchStart = null;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
    else setDir(0, dy > 0 ? 1 : -1);
  }, { passive: true });

  reset();
  draw();
})();
</script>
</body>
</html>
